# Render Blueprint - deploys both services in one shot via Render's dashboard
# (New + → Blueprint → point at this GitHub repo). No gcloud, no Cloud Shell, no separate
# database/storage service needed.
#
# FREE TIER TRADEOFF: this version runs on Render's free plan (no persistent disk, since disks
# require the paid Starter plan). Without a disk, the backend's local SQLite database, uploaded
# resumes, and Chroma vector DB reset every time the service redeploys or spins down from 15
# minutes of inactivity - fine for trying it out, not fine for real user data. When you're ready
# to keep data permanently, add back a `disk:` block under the backend service and set
# `plan: starter` (~$7/mo) - see RENDER_DEPLOY.md for the exact snippet.
services:
  - type: web
    name: studysager-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true   # Render generates and stores a random secret for you
      # Predictable because Render service URLs follow https://<name>.onrender.com for the
      # `name` given below - adjust both this and the frontend's VITE_API_URL together if you
      # rename either service.
      - key: EXTRA_CORS_ORIGINS
        value: https://studysager-frontend.onrender.com
      # sync: false = "this env var exists, but set its real value yourself in the Render
      # dashboard after the first deploy" - keeps API keys out of this file and out of git.
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: studysager-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://studysager-backend.onrender.com
    routes:
      # Client-side routing fallback - any path that isn't a real built file serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
