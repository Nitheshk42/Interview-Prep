# Render Blueprint - deploys both services in one shot via Render's dashboard
# (New + → Blueprint → point at this GitHub repo). No gcloud, no Cloud Shell, no separate
# database/storage service needed.
#
# User accounts + chat history now live in the free Postgres instance declared below (see
# `databases:`), NOT the backend's local disk - so they survive redeploys and free-tier spin-downs.
# Render's free Postgres plan auto-expires 30 days after creation unless upgraded to a paid
# instance; RENDER_DEPLOY.md has the upgrade note for when that matters to you.
#
# Uploaded resumes and the Chroma vector DB still live on the backend's local disk (no persistent
# disk on the free web-service plan), so those reset on redeploy/spin-down - restored
# automatically from GCS if GCS_BUCKET_NAME is configured, otherwise the user just re-uploads.
services:
  - type: web
    name: studysager-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studysager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render generates and stores a random secret for you
      # Predictable because Render service URLs follow https://<name>.onrender.com for the
      # `name` given below - adjust both this and the frontend's VITE_API_URL together if you
      # rename either service.
      - key: EXTRA_CORS_ORIGINS
        value: https://studysager-frontend.onrender.com
      # sync: false = "this env var exists, but set its real value yourself in the Render
      # dashboard after the first deploy" - keeps API keys out of this file and out of git.
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: studysager-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://studysager-backend.onrender.com
    routes:
      # Client-side routing fallback - any path that isn't a real built file serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: studysager-db
    plan: free
    region: oregon
